<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: page('Thông báo', ~{::section})}">
<body>
<section>
  <div class="page-header page-header-actions">
    <div>
      <div class="page-pretitle">HỘP THƯ CÁ NHÂN</div>
      <h1 class="page-title">Thông báo</h1>
      <p class="text-secondary mt-2 mb-0">Theo dõi thông báo học vụ và các cập nhật liên quan trực tiếp đến bạn.</p>
    </div>
    <div class="d-flex flex-wrap align-items-center justify-content-end gap-2" th:if="${headerUnreadCount > 0}">
      <span class="badge bg-azure-lt" th:text="${headerUnreadCount + ' chưa đọc'}">2 chưa đọc</span>
      <form th:action="@{/notifications/read-all}" method="post">
        <button class="btn btn-sm btn-outline-secondary" type="submit">Đánh dấu tất cả đã đọc</button>
      </form>
    </div>
  </div>

  <div class="alert alert-success" role="status" th:if="${successMessage != null}"
       th:text="${successMessage}">Đã cập nhật trạng thái thông báo.</div>

  <div class="card mb-3">
    <div class="card-body">
      <form class="table-toolbar" method="get" th:action="@{/notifications}">
        <strong class="me-1">Lọc thông báo</strong>
        <label class="visually-hidden" for="notification-status">Trạng thái</label>
        <select class="form-select" id="notification-status" name="status">
          <option value="ALL" th:selected="${selectedStatus.name() == 'ALL'}">Tất cả trạng thái</option>
          <option value="UNREAD" th:selected="${selectedStatus.name() == 'UNREAD'}">Chưa đọc</option>
        </select>
        <label class="visually-hidden" for="notification-category">Loại thông báo</label>
        <select class="form-select" id="notification-category" name="category">
          <option value="ALL" th:selected="${selectedCategory.name() == 'ALL'}">Tất cả loại</option>
          <option value="ANNOUNCEMENT" th:selected="${selectedCategory.name() == 'ANNOUNCEMENT'}">Thông báo chung</option>
          <option value="ACADEMIC_EVENT" th:selected="${selectedCategory.name() == 'ACADEMIC_EVENT'}">Cập nhật học vụ</option>
        </select>
        <button class="btn btn-primary" type="submit">Áp dụng</button>
      </form>
    </div>
  </div>

  <div class="card" th:if="${!notifications.isEmpty()}">
    <div class="list-group list-group-flush">
      <article class="list-group-item" th:each="item : ${notifications}"
               th:classappend="${item.unread()} ? ' notification-unread'">
        <div class="d-flex align-items-start justify-content-between gap-3">
          <form class="notification-open-form min-w-0 flex-fill" method="post"
                th:action="@{/notifications/{id}/open(id=${item.id()})}">
            <button class="notification-content-button text-start" type="submit">
              <span class="d-flex flex-wrap align-items-center gap-2 mb-2">
                <span class="badge" th:classappend="${item.unread()} ? ' bg-azure text-azure-fg' : ' bg-secondary-lt'"
                      th:text="${item.unread()} ? 'Chưa đọc' : 'Đã đọc'">Chưa đọc</span>
                <span class="badge bg-purple-lt" th:if="${item.category().name() == 'ANNOUNCEMENT'}">Thông báo chung</span>
                <span class="badge bg-azure-lt" th:if="${item.category().name() == 'ACADEMIC_EVENT'}">Cập nhật học vụ</span>
              </span>
              <span class="h3 d-block mb-2 text-body" th:text="${item.title()}">Tiêu đề thông báo</span>
              <span class="text-secondary d-block mb-2 topic-text" th:text="${item.body()}">Nội dung thông báo</span>
              <time class="small text-secondary" th:datetime="${item.deliveredAt()}"
                    th:text="${item.deliveredAt()}">2026-09-24T08:15:00Z</time>
            </button>
          </form>
          <form method="post" th:if="${item.unread()}"
                th:action="@{/notifications/{id}/read(id=${item.id()})}">
            <button class="btn btn-sm btn-outline-secondary" type="submit">Đánh dấu đã đọc</button>
          </form>
        </div>
      </article>
    </div>
    <div class="card-footer d-flex flex-wrap align-items-center justify-content-between gap-3"
         th:if="${notificationPage.totalElements > 0}">
      <span class="text-secondary" th:text="${'Trang ' + displayedPage + ' / ' + displayedTotalPages}">Trang 1 / 1</span>
      <nav aria-label="Phân trang thông báo" th:if="${displayedTotalPages > 1}">
        <div class="btn-list">
          <a class="btn btn-outline-secondary" th:if="${notificationPage.hasPrevious()}"
             th:href="@{/notifications(status=${selectedStatus},category=${selectedCategory},page=${currentPage - 1})}">Trang trước</a>
          <a class="btn btn-outline-secondary" th:if="${notificationPage.hasNext()}"
             th:href="@{/notifications(status=${selectedStatus},category=${selectedCategory},page=${currentPage + 1})}">Trang sau</a>
        </div>
      </nav>
    </div>
  </div>

  <div class="card" th:if="${notifications.isEmpty()}"
       th:insert="~{fragments/feedback :: empty('Bạn chưa có thông báo', 'Các cập nhật học vụ dành cho bạn sẽ xuất hiện tại đây.')}"></div>
</section>
</body>
</html>
