<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: page('Kết quả hội đồng', ~{::section})}">
<body>
<section>
  <div class="page-header page-header-actions">
    <div>
      <div class="page-pretitle">QUẢN LÝ HỌC VỤ</div>
      <h1 class="page-title">Kết quả hội đồng</h1>
      <p class="text-secondary mt-2 mb-0">Điểm đã tổng hợp và trạng thái công bố trong phạm vi khoa.</p>
    </div>
    <a class="btn btn-outline-secondary" th:href="@{/faculty/boards}">Xem hội đồng</a>
  </div>

  <div class="card data-card" th:if="${!results.isEmpty()}">
    <div class="card-header">
      <h2 class="card-title">Danh sách kết quả</h2>
      <span class="badge bg-blue-lt ms-auto" th:text="${#lists.size(results)} + ' kết quả'">1 kết quả</span>
    </div>
    <div class="table-responsive">
      <table class="table table-vcenter card-table responsive-table">
        <thead>
        <tr><th>Nhóm / đề tài</th><th>Hội đồng</th><th>Điểm cuối</th><th>Trạng thái</th><th>Thời điểm</th><th><span class="visually-hidden">Thao tác</span></th></tr>
        </thead>
        <tbody>
        <tr th:each="result : ${results}">
          <td data-label="Nhóm / đề tài">
            <strong th:text="${'N' + #numbers.formatInteger(result.groupId, 3)}">N001</strong>
            <div class="small text-secondary" th:text="${result.topicTitle}">Đề tài</div>
          </td>
          <td data-label="Hội đồng" th:text="${result.councilName}">Hội đồng KLTN</td>
          <td data-label="Điểm cuối"><span class="fs-3 fw-bold" th:text="${result.finalScore}">8.50</span></td>
          <td data-label="Trạng thái"><span class="badge" th:classappend="${result.statusClass}" th:text="${result.statusLabel}">Sẵn sàng</span></td>
          <td data-label="Thời điểm">
            <span th:text="${result.publishedAt != null ? result.publishedAt : result.consolidatedAt}">21/09/2026 09:00</span>
          </td>
          <td data-label="Thao tác" class="text-end"><a class="btn btn-sm btn-ghost-primary" th:href="@{/faculty/results/{id}(id=${result.registrationId})}">Xem chi tiết</a></td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card" th:if="${results.isEmpty()}"
       th:insert="~{fragments/feedback :: empty('Chưa có kết quả', 'Chủ tịch hội đồng cần tổng hợp đủ điểm trước khi kết quả xuất hiện tại đây.')}"></div>
</section>
</body>
</html>
