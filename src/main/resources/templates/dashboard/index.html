<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/main :: page('Tổng quan', ~{::section})}">
<body><section>
  <div class="page-header dashboard-heading">
    <div>
      <div class="page-pretitle" th:text="${dashboard.audience}">Vai trò</div>
      <h1 class="page-title" th:text="${dashboard.title}">Tổng quan</h1>
      <p class="text-secondary mt-2 mb-0" th:text="${dashboard.subtitle}">Nội dung theo vai trò.</p>
    </div>
    <div class="date-label"><span aria-hidden="true">◷</span> <time th:text="${today}">14/09/2026</time></div>
  </div>

  <div class="row row-cards mb-4" th:if="${!dashboard.metrics.isEmpty()}">
    <div class="col-sm-6 col-xl-3" th:each="metric : ${dashboard.metrics}">
      <div class="card metric-card h-100"><div class="card-body">
        <div class="metric-label"><span th:text="${metric.label}">Số liệu</span><span class="metric-icon bg-blue-lt" aria-hidden="true">▤</span></div>
        <div class="metric-value" th:text="${metric.value}">0</div>
        <p class="text-secondary small mb-3" th:text="${metric.description}">Mô tả</p>
        <a class="stretched-link" th:if="${metric.href != null}" th:href="${metric.href}"
           th:aria-label="|Xem ${metric.label}|">Xem chi tiết <span aria-hidden="true">→</span></a>
      </div></div>
    </div>
  </div>

  <div class="card dashboard-focus" th:classappend="${dashboard.focus.badgeClass == 'bg-green-lt'} ? ' dashboard-focus-success' : ''">
    <div class="card-body">
      <span class="badge mb-3" th:classappend="${dashboard.focus.badgeClass}" th:text="${dashboard.focus.label}">TRẠNG THÁI</span>
      <h2 class="h2 mb-2" th:text="${dashboard.focus.title}">Việc cần làm</h2>
      <p class="text-secondary mb-0" th:text="${dashboard.focus.description}">Hướng dẫn tiếp theo.</p>
      <a class="btn btn-primary mt-4" th:if="${dashboard.focus.href != null}" th:href="${dashboard.focus.href}" th:text="${dashboard.focus.actionLabel}">Xem chi tiết</a>
    </div>
  </div>
</section></body></html>
