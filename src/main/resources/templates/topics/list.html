<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: page('Danh sách đề tài', ~{::section})}">
<body>
<section>
  <div class="page-header page-header-actions">
    <div>
      <div class="page-pretitle" th:text="${period.name}">ĐỢT ĐĂNG KÝ</div>
      <h1 class="page-title">Đề tài của tôi</h1>
      <p class="text-secondary mt-2 mb-0">Theo dõi đề tài từ bản nháp đến khi được công bố.</p>
    </div>
    <a class="btn btn-primary" th:href="@{/periods/{id}/topics/new(id=${period.id})}">
      <span aria-hidden="true">＋</span> Tạo đề tài
    </a>
  </div>

  <div class="card data-card" th:if="${!topics.isEmpty()}">
    <div class="card-header table-toolbar">
      <div class="input-icon flex-fill topic-search">
        <span class="input-icon-addon" aria-hidden="true">⌕</span>
        <input class="form-control" type="search"
               placeholder="Tìm theo tên đề tài hoặc giảng viên"
               aria-label="Tìm đề tài" data-table-filter>
      </div>
      <div class="ms-md-auto">
        <select class="form-select" aria-label="Lọc trạng thái" data-status-filter>
          <option value="">Tất cả trạng thái</option>
          <option value="Nháp">Nháp</option>
          <option value="Chờ duyệt">Chờ duyệt</option>
          <option value="Đã duyệt">Đã duyệt</option>
          <option value="Đã công bố">Đã công bố</option>
        </select>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table table-vcenter card-table responsive-table" data-filter-table>
        <thead>
        <tr>
          <th>Đề tài</th>
          <th>Giảng viên đề xuất</th>
          <th>Giảng viên hướng dẫn</th>
          <th>Trạng thái</th>
          <th><span class="visually-hidden">Thao tác</span></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="topic : ${topics}" th:attr="data-status=${topic.status}">
          <td data-label="Đề tài">
            <a class="fw-semibold" th:href="@{/topics/{id}(id=${topic.id})}"
               th:text="${#strings.isEmpty(topic.title) ? 'Chưa đặt tên' : topic.title}">Tên đề tài</a>
            <div class="small text-secondary" th:text="${topic.department}">Bộ môn</div>
          </td>
          <td data-label="Người đề xuất" th:text="${topic.author}">Giảng viên</td>
          <td data-label="Giảng viên hướng dẫn" th:text="${topic.supervisorNames}">Chưa chọn</td>
          <td data-label="Trạng thái">
            <span class="badge" th:classappend="${topic.statusClass}"
                  th:text="${topic.status}">Nháp</span>
          </td>
          <td data-label="Thao tác" class="text-end">
            <a class="btn btn-sm btn-ghost-primary"
               th:href="@{/topics/{id}(id=${topic.id})}">Xem chi tiết</a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="card" th:if="${topics.isEmpty()}"
       th:insert="~{fragments/feedback :: empty('Chưa có đề tài', 'Tạo bản nháp đầu tiên cho đợt đăng ký này.')}" ></div>
</section>
</body>
</html>
