<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/main :: page(${editing ? 'Sửa đề tài' : 'Tạo đề tài'}, ~{::section})}">
<body>
<section>
  <div class="page-header">
    <div><div class="page-pretitle" th:text="${period.name}">ĐỢT ĐĂNG KÝ</div><h1 class="page-title" th:text="${editing} ? 'Sửa nội dung đề tài' : 'Đề xuất đề tài mới'">Đề xuất đề tài mới</h1><p class="text-secondary mt-2 mb-0">Lưu bản nháp trước khi gửi trưởng khoa duyệt.</p></div>
  </div>
  <form class="card" method="post" data-prevent-double-submit
        th:action="${editing} ? @{/topics/{id}/draft(id=${topic.id})} : @{/periods/{id}/topics(id=${period.id})}">
    <div class="card-body">
      <div th:if="${formError}" th:replace="~{fragments/feedback :: error(${formError})}"></div>
      <div class="mb-3"><label class="form-label required" for="topic-title">Tên đề tài</label><input class="form-control" id="topic-title" name="title" required th:value="${topic?.title}" placeholder="Nhập tên đề tài rõ ràng, ngắn gọn"></div>
      <div class="mb-3"><label class="form-label required" for="topic-description">Mô tả</label><textarea class="form-control" id="topic-description" name="description" rows="4" required placeholder="Bối cảnh và phạm vi của đề tài"></textarea></div>
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label required" for="topic-objectives">Mục tiêu</label><textarea class="form-control" id="topic-objectives" name="objectives" rows="5" required placeholder="Kết quả mà đề tài cần đạt"></textarea></div>
        <div class="col-md-6"><label class="form-label required" for="student-requirements">Yêu cầu sinh viên</label><textarea class="form-control" id="student-requirements" name="studentRequirements" rows="5" required placeholder="Kiến thức và kỹ năng cần có"></textarea></div>
      </div>
      <div class="mt-3"><label class="form-label required" for="expected-results">Kết quả dự kiến</label><textarea class="form-control" id="expected-results" name="expectedResults" rows="4" required placeholder="Sản phẩm, tài liệu hoặc số liệu cần bàn giao"></textarea></div>
      <hr class="my-4">
      <h2 class="h3">Giảng viên hướng dẫn</h2><p class="text-secondary">Chọn từ một đến hai giảng viên cùng bộ môn.</p>
      <div class="row g-3"><div class="col-md-6"><label class="form-label required" for="supervisor-one">Giảng viên hướng dẫn 1</label><select class="form-select" id="supervisor-one" name="supervisorIds" required><option value="">Chọn giảng viên</option><option value="11">TS. Nguyễn Văn An</option><option value="12">ThS. Phạm Quốc Bảo</option></select></div><div class="col-md-6"><label class="form-label" for="supervisor-two">Giảng viên hướng dẫn 2</label><select class="form-select" id="supervisor-two" name="supervisorIds"><option value="">Không chọn</option><option value="13">TS. Lê Minh</option><option value="14">ThS. Trần Thu Hà</option></select></div></div>
      <input th:if="${editing}" type="hidden" name="version" value="0">
    </div>
    <div class="card-footer d-flex flex-wrap justify-content-end gap-2"><a class="btn btn-ghost-secondary" th:href="@{/periods/{id}/topics(id=${period.id})}">Hủy</a><button class="btn btn-primary" type="submit">Lưu bản nháp</button></div>
  </form>
</section>
</body>
</html>
