<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: page('Nhóm sinh viên', ~{::section})}">
<body>
<section>
  <div class="page-header page-header-actions">
    <div>
      <div class="page-pretitle">NHÓM SINH VIÊN</div>
      <h1 class="page-title">Nhóm của tôi theo đợt</h1>
      <p class="text-secondary mt-2 mb-0">
        Chọn đợt để tạo nhóm hoặc tiếp tục quản lý nhóm hiện tại. Thành viên chỉ được thêm sau khi chấp nhận lời mời.
      </p>
    </div>
    <a class="btn btn-outline-primary invitation-link" th:href="@{/group-invitations}">
      Lời mời của tôi
      <span class="badge bg-primary text-primary-fg ms-1" th:if="${pendingInvitationCount > 0}"
            th:text="${pendingInvitationCount}">1</span>
    </a>
  </div>

  <div class="row row-cards" th:if="${!periods.isEmpty()}">
    <div class="col-md-6 col-xl-4" th:each="period : ${periods}">
      <article class="card group-period-card h-100">
        <div class="card-body d-flex flex-column">
          <div class="d-flex align-items-start justify-content-between gap-3 mb-3">
            <div class="d-flex flex-wrap gap-2">
              <span class="badge" th:classappend="${period.statusClass}" th:text="${period.status}">Trạng thái</span>
              <span class="badge bg-yellow-lt" th:if="${period.hasPendingInvitation}">Có lời mời đang chờ</span>
            </div>
            <span class="group-period-icon" aria-hidden="true">👥</span>
          </div>
          <h2 class="h3 mb-2" th:text="${period.name}">Tên đợt</h2>
          <p class="text-secondary mb-4">
            Thời gian sinh viên: <strong class="text-body" th:text="${period.studentWindow}">01/09/2026 – 10/09/2026</strong>
          </p>
          <a class="btn mt-auto"
             th:classappend="${(period.hasGroup ? 'btn-outline-primary' : (period.hasPendingInvitation ? 'btn-warning' : 'btn-primary')) + ((!period.hasGroup and !period.hasPendingInvitation and !period.studentOpen) ? ' disabled' : '')}"
             th:href="${period.hasGroup
                 ? '/periods/' + period.id + '/groups'
                 : (period.hasPendingInvitation ? '/group-invitations' : '/periods/' + period.id + '/groups/new')}"
             th:attr="aria-disabled=${!period.hasGroup and !period.hasPendingInvitation and !period.studentOpen}"
             th:text="${period.hasGroup ? 'Xem nhóm của tôi' : (period.hasPendingInvitation ? 'Phản hồi lời mời' : 'Tạo nhóm')}">Mở nhóm</a>
        </div>
      </article>
    </div>
  </div>

  <div class="card" th:if="${periods.isEmpty()}"
       th:insert="~{fragments/feedback :: empty('Chưa có đợt đăng ký', 'Nhóm sẽ được tạo khi trưởng khoa mở đợt đăng ký cho sinh viên.')}" ></div>
</section>
</body>
</html>
