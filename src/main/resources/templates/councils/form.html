<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: page('Lập hội đồng', ~{::section})}">
<body>
<section>
  <div class="page-header page-header-actions">
    <div>
      <div class="page-pretitle">HỘI ĐỒNG MỚI</div>
      <h1 class="page-title">Lập hội đồng</h1>
      <p class="text-secondary mt-2 mb-0"><span th:text="${workspace.periodName}">Đợt KLTN</span> · <span th:text="${workspace.facultyName}">Khoa Công nghệ Thông tin</span></p>
    </div>
    <a class="btn btn-outline-secondary" th:href="@{/faculty/boards}">Quay lại</a>
  </div>

  <form class="card" method="post" th:action="@{/faculty/boards}" th:object="${councilForm}" data-prevent-double-submit>
    <input type="hidden" th:field="*{periodId}">
    <div class="card-header"><h2 class="card-title">Thông tin hội đồng</h2></div>
    <div class="card-body">
      <div class="alert alert-danger" role="alert" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}">Dữ liệu chưa hợp lệ.</div>
      <div class="mb-3">
        <label class="form-label" for="name">Tên hội đồng</label>
        <input class="form-control" id="name" type="text" th:field="*{name}" maxlength="255" required>
        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
      </div>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="chairId">Chủ tịch</label>
          <select class="form-select" id="chairId" th:field="*{chairId}" required>
            <option value="">Chọn giảng viên</option>
            <option th:each="lecturer : ${lecturers}" th:value="${lecturer.id}" th:text="${lecturer.fullName + ' (' + lecturer.username + ')'}">Giảng viên</option>
          </select>
          <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('chairId')}" th:errors="*{chairId}"></div>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="secretaryId">Thư ký</label>
          <select class="form-select" id="secretaryId" th:field="*{secretaryId}" required>
            <option value="">Chọn giảng viên</option>
            <option th:each="lecturer : ${lecturers}" th:value="${lecturer.id}" th:text="${lecturer.fullName + ' (' + lecturer.username + ')'}">Giảng viên</option>
          </select>
          <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('secretaryId')}" th:errors="*{secretaryId}"></div>
        </div>
      </div>
      <div class="mt-3">
        <label class="form-label" for="memberIds">Thành viên bổ sung</label>
        <select class="form-select" id="memberIds" th:field="*{memberIds}" multiple size="5" required aria-describedby="member-help">
          <option th:each="lecturer : ${lecturers}" th:value="${lecturer.id}" th:text="${lecturer.fullName + ' (' + lecturer.username + ')'}">Giảng viên</option>
        </select>
        <div class="form-hint" id="member-help">Chọn 1–3 người; không chọn lại Chủ tịch hoặc Thư ký. Tổng số thành viên phải từ 3 đến 5.</div>
        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('memberIds')}" th:errors="*{memberIds}"></div>
      </div>
    </div>
    <div class="card-footer text-end"><button class="btn btn-primary" type="submit">Tạo hội đồng nháp</button></div>
  </form>
</section>
</body>
</html>
