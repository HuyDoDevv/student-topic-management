<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: page('Phiếu chấm hội đồng', ~{::section})}">
<body>
<section>
  <div class="page-header page-header-actions">
    <div>
      <div class="page-pretitle" th:text="${assignment.councilName + ' · Nhóm N' + #numbers.formatInteger(assignment.groupId, 3)}">Hội đồng · N001</div>
      <h1 class="page-title" th:text="${assignment.topicTitle}">Đề tài</h1>
      <div class="mt-2"><span class="badge" th:classappend="${allSubmitted} ? 'bg-green-lt' : 'bg-yellow-lt'" th:text="${allSubmitted} ? 'Đã đủ điểm từng sinh viên' : 'Chưa chấm đủ sinh viên'">Chưa chấm đủ sinh viên</span></div>
    </div>
    <div class="btn-list">
      <a class="btn btn-outline-secondary" th:href="@{/lecturer/scoring}">Quay lại</a>
      <a class="btn btn-outline-secondary" th:if="${assignment.currentChair and !assignment.directGrading}"
         th:href="@{/faculty/boards/{id}(id=${assignment.councilId})}">Mở hội đồng</a>
      <a class="btn btn-outline-primary" th:href="@{/reports/{id}(id=${assignment.registrationId})}">Xem báo cáo</a>
    </div>
  </div>
  <div class="alert alert-info" th:if="${assignment.directGrading and allSubmitted}">
    Bạn đã nộp đủ điểm. Trưởng khoa sẽ đối soát, tổng hợp và công bố kết quả.
  </div>

  <div class="card">
    <div class="card-header"><h2 class="card-title">Điểm theo từng sinh viên</h2></div>
    <div class="table-responsive">
      <table class="table table-vcenter card-table responsive-table">
        <thead><tr><th>Sinh viên</th><th>Vị trí</th><th>Điểm</th><th>Trạng thái</th><th><span class="visually-hidden">Thao tác</span></th></tr></thead>
        <tbody>
        <tr th:each="student : ${students}">
          <td data-label="Sinh viên" class="fw-semibold" th:text="${student.studentName}">Sinh viên A</td>
          <td data-label="Vị trí" th:text="${student.leaderAtSubmission ? 'Trưởng nhóm' : 'Thành viên'}">Thành viên</td>
          <td data-label="Điểm" th:text="${student.evaluation != null ? student.evaluation.score : '—'}">—</td>
          <td data-label="Trạng thái">
            <span class="badge" th:classappend="${student.evaluation != null and student.evaluation.status.name() == 'SUBMITTED'} ? 'bg-green-lt' : 'bg-secondary-lt'"
                  th:text="${student.evaluation == null ? 'Chưa chấm' : (student.evaluation.status.name() == 'SUBMITTED' ? 'Đã nộp' : 'Bản nháp')}">Chưa chấm</span>
          </td>
          <td data-label="Thao tác" class="text-end">
            <a class="btn btn-sm btn-primary"
               th:href="@{/lecturer/scoring/{councilId}/{registrationId}/students/{studentId}(councilId=${assignment.councilId},registrationId=${assignment.registrationId},studentId=${student.studentId})}"
               th:text="${student.evaluation == null ? 'Chấm điểm' : 'Xem / sửa'}">Chấm điểm</a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
</body>
</html>
