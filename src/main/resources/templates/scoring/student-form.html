<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: page('Chấm điểm sinh viên', ~{::section})}">
<body>
<section>
  <div class="page-header page-header-actions">
    <div>
      <div class="page-pretitle" th:text="${assignment.councilName + ' · Nhóm N' + #numbers.formatInteger(assignment.groupId, 3)}">Hội đồng · N001</div>
      <h1 class="page-title" th:text="${student.studentName}">Sinh viên</h1>
      <p class="text-secondary mt-2 mb-0" th:text="${assignment.topicTitle}">Đề tài</p>
      <div class="mt-2"><span class="badge" th:classappend="${submitted} ? 'bg-green-lt' : 'bg-secondary-lt'" th:text="${submitted} ? 'Đã nộp điểm' : 'Bản nháp'">Bản nháp</span></div>
    </div>
    <div class="btn-list">
      <a class="btn btn-outline-secondary" th:href="@{/lecturer/scoring/{councilId}/{registrationId}(councilId=${assignment.councilId},registrationId=${assignment.registrationId})}">Danh sách sinh viên</a>
      <a class="btn btn-outline-primary" th:href="@{/reports/{id}(id=${assignment.registrationId})}">Xem báo cáo</a>
    </div>
  </div>

  <form class="card" method="post"
        th:action="@{/lecturer/scoring/{councilId}/{registrationId}/students/{studentId}/draft(councilId=${assignment.councilId},registrationId=${assignment.registrationId},studentId=${student.studentId})}"
        th:object="${scoreForm}" data-prevent-double-submit>
    <input type="hidden" th:field="*{version}">
    <div class="card-header"><h2 class="card-title">Điểm cá nhân</h2></div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label" for="score">Điểm tổng <span class="text-danger">*</span></label>
          <input class="form-control" id="score" type="number" th:field="*{score}" min="0" max="10" step="0.25" inputmode="decimal" required>
          <div class="form-hint">Từ 0 đến 10, tăng theo bước 0,25; ví dụ 5,5 hoặc 7,75.</div>
          <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('score')}" th:errors="*{score}"></div>
        </div>
        <div class="col-md-8">
          <label class="form-label" for="feedback">Nhận xét riêng cho sinh viên</label>
          <textarea class="form-control" id="feedback" th:field="*{feedback}" rows="6"></textarea>
        </div>
      </div>
    </div>
    <div class="card-footer d-flex flex-wrap justify-content-end gap-2">
      <button class="btn btn-outline-primary" type="submit">Lưu nháp</button>
      <button class="btn btn-primary" type="submit"
              th:formaction="@{/lecturer/scoring/{councilId}/{registrationId}/students/{studentId}/submit(councilId=${assignment.councilId},registrationId=${assignment.registrationId},studentId=${student.studentId})}"
              data-confirm="Nộp điểm cho sinh viên này? Bạn vẫn có thể sửa khi lượt chấm đang hoạt động.">Nộp điểm</button>
    </div>
  </form>
</section>
</body>
</html>
