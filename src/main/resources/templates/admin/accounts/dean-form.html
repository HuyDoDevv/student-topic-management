<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: page('Thêm trưởng khoa', ~{::section})}">
<body>
<section>
  <div class="page-header page-header-actions">
    <div><div class="page-pretitle">QUẢN LÝ TRƯỞNG KHOA</div><h1 class="page-title">Thêm trưởng khoa</h1>
      <p class="text-secondary mt-2 mb-0">Trưởng khoa nhận đồng thời vai trò Giảng viên; email sẽ được cập nhật sau.</p></div>
    <a class="btn btn-outline-secondary" th:href="@{/admin/accounts/deans}">Về danh sách</a>
  </div>
  <div class="row row-cards"><div class="col-xl-8">
    <form class="card" method="post" th:action="@{/admin/accounts/deans}"
          th:object="${deanAccountForm}" data-prevent-double-submit>
      <div class="card-header"><h2 class="card-title">Thông tin trưởng khoa</h2></div>
      <div class="card-body">
        <div class="alert alert-danger" role="alert" th:if="${#fields.hasGlobalErrors()}"
             th:each="error : ${#fields.globalErrors()}" th:text="${error}">Dữ liệu chưa hợp lệ.</div>
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label" for="fullName">Họ tên <span class="text-danger">*</span></label>
            <input class="form-control" id="fullName" type="text" th:field="*{fullName}" maxlength="255" required>
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div></div>
          <div class="col-md-6"><label class="form-label" for="username">Tên đăng nhập <span class="text-danger">*</span></label>
            <input class="form-control" id="username" type="text" th:field="*{username}" maxlength="191" autocomplete="off" required>
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div></div>
          <div class="col-md-6"><label class="form-label" for="password">Mật khẩu tạm thời <span class="text-danger">*</span></label>
            <input class="form-control" id="password" type="password" th:field="*{password}" minlength="8" maxlength="72" autocomplete="new-password" required>
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('passwordWithinBcryptLimit')}" th:errors="*{passwordWithinBcryptLimit}"></div></div>
        </div>
      </div>
      <div class="card-footer text-end"><button class="btn btn-primary" type="submit">Tạo trưởng khoa</button></div>
    </form>
  </div></div>
</section>
</body>
</html>
