<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="navbar navbar-expand-lg app-header d-print-none" th:fragment="header">
  <div class="app-container">
    <span class="header-breadcrumb">
      <span th:text="${pageSection ?: 'Không gian làm việc'}">Không gian làm việc</span>
      <span aria-hidden="true">/</span>
      <strong>Hệ thống đề tài</strong>
    </span>
    <span class="header-mobile-context">Không gian học vụ</span>
    <div class="header-actions d-flex align-items-center gap-3">
      <span class="badge bg-teal-lt d-none d-sm-inline-flex">Cổng học vụ</span>
      <div class="dropdown">
        <button class="btn btn-icon header-ghost-button notification-trigger position-relative" type="button"
                data-bs-toggle="dropdown" aria-expanded="false" th:aria-label="${notificationAriaLabel ?: 'Xem thông báo'}">
          <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path d="M10 5a2 2 0 0 1 4 0 6 6 0 0 1 4 6v4l2 2H4l2-2v-4a6 6 0 0 1 4-6M9 21h6"/>
          </svg>
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill notification-count-badge"
                th:if="${hasUnreadNotifications}" th:text="${headerUnreadBadge}">3</span>
        </button>
        <div class="dropdown-menu dropdown-menu-end notification-menu p-0">
          <div class="p-3 border-bottom d-flex align-items-center justify-content-between gap-3">
            <h2 class="h4 mb-0">Thông báo</h2>
            <span class="badge bg-blue-lt" th:if="${hasUnreadNotifications}"
                  th:text="${headerUnreadCount + ' chưa đọc'}">3 chưa đọc</span>
          </div>
          <div class="list-group list-group-flush" th:if="${headerNotifications != null and !headerNotifications.isEmpty()}">
            <form class="list-group-item list-group-item-action p-0" method="post"
                  th:each="item : ${headerNotifications}"
                  th:classappend="${item.unread()} ? ' notification-unread'"
                  th:action="@{/notifications/{id}/open(id=${item.id()})}">
              <button class="notification-dropdown-button text-start" type="submit">
                <span class="d-flex align-items-start justify-content-between gap-2">
                  <strong class="text-body" th:text="${item.title()}">Tiêu đề thông báo</strong>
                  <span class="badge bg-azure-lt" th:if="${item.unread()}">Chưa đọc</span>
                </span>
                <span class="d-block small text-secondary text-truncate mt-1" th:text="${item.body()}">Nội dung</span>
                <time class="d-block small text-secondary mt-1" th:datetime="${item.deliveredAt()}"
                      th:text="${item.deliveredAt()}">2026-09-24T08:15:00Z</time>
              </button>
            </form>
          </div>
          <p class="text-secondary mb-0 p-3"
             th:if="${headerNotifications == null or headerNotifications.isEmpty()}">Chưa có thông báo để hiển thị.</p>
          <div class="p-2 border-top text-center">
            <a class="btn btn-ghost-primary w-100" th:href="@{/notifications}">Xem tất cả thông báo</a>
          </div>
        </div>
      </div>
      <div class="dropdown">
        <button class="btn btn-ghost-secondary header-ghost-button account-menu-trigger d-flex align-items-center gap-2" type="button"
                data-bs-toggle="dropdown" aria-expanded="false" aria-label="Mở menu tài khoản">
          <span class="avatar avatar-sm bg-blue-lt" th:text="${currentUserInitials ?: 'ND'}">ND</span>
          <span class="d-none d-md-block text-start">
            <strong class="d-block" th:text="${currentUserName ?: 'Người dùng'}">Người dùng</strong>
            <small class="text-secondary" th:text="${currentRoleLabel ?: 'Chưa đăng nhập'}">Chưa đăng nhập</small>
          </span>
        </button>
        <div class="dropdown-menu dropdown-menu-end">
          <a class="dropdown-item" th:href="@{/dashboard}">Trang tổng quan</a>
          <div class="dropdown-divider"></div>
          <form th:action="@{/logout}" method="post"><button class="dropdown-item" type="submit">Đăng xuất</button></form>
        </div>
      </div>
    </div>
  </div>
</header>
</body>
</html>
