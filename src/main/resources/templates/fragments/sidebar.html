<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="navbar navbar-vertical navbar-expand-lg app-sidebar" th:fragment="sidebar" aria-label="Thanh điều hướng">
  <div class="container-fluid">
    <a class="navbar-brand app-brand" th:href="@{/dashboard}">
      <span class="brand-mark">ĐT</span>
      <span>Quản lý đề tài<small>KHOA CÔNG NGHỆ THÔNG TIN</small></span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu"
            aria-controls="sidebar-menu" aria-expanded="false" aria-label="Mở menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="sidebar-menu">
      <div class="nav-section">KHÔNG GIAN LÀM VIỆC</div>
      <ul class="navbar-nav">
        <li class="nav-item" th:classappend="${activeNav == 'dashboard'} ? ' active'">
          <a class="nav-link" th:href="@{/dashboard}"><span class="nav-symbol" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></span><span class="nav-link-title">Tổng quan</span></a>
        </li>
      </ul>
      <div class="nav-section mt-4">QUẢN LÝ HỌC VỤ</div>
      <ul class="navbar-nav">
        <li class="nav-item" th:if="${canManagePeriods}" th:classappend="${activeNav == 'periods'} ? ' active'">
          <a class="nav-link" th:href="@{/periods}"><span class="nav-symbol" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 5h14a2 2 0 0 1 2 2v12H3V7a2 2 0 0 1 2-2zM7 3v4M17 3v4M3 10h18M7 14h2M12 14h2M17 14h1"/></svg></span><span class="nav-link-title">Đợt đăng ký</span></a>
        </li>
        <li class="nav-item" th:if="${canAuthorTopics}" th:classappend="${activeNav == 'topics'} ? ' active'">
          <a class="nav-link" th:href="@{/topics}"><span class="nav-symbol" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 4h9l3 3v13H6zM14 4v4h4M9 12h6M9 16h6"/></svg></span><span class="nav-link-title">Đề tài</span></a>
        </li>
        <li class="nav-item" th:if="${previewMode}" th:classappend="${activeNav == 'reviews'} ? ' active'">
          <a class="nav-link" th:href="@{/periods/1/topics/review}"><span class="nav-symbol" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg></span><span class="nav-link-title">Duyệt đề tài</span></a>
        </li>
        <li class="nav-item" th:if="${previewMode}" th:classappend="${activeNav == 'groups'} ? ' active'">
          <a class="nav-link" th:href="@{/groups/1}"><span class="nav-symbol" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM17 11a3 3 0 1 0 0-6M3 21v-2a6 6 0 0 1 12 0v2M16 15a5 5 0 0 1 5 5v1"/></svg></span><span class="nav-link-title">Nhóm sinh viên</span></a>
        </li>
        <li class="nav-item" th:if="${previewMode}" th:classappend="${activeNav == 'registrations'} ? ' active'">
          <a class="nav-link" th:href="@{/registrations/1}"><span class="nav-symbol" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5h6M9 3h6v4H9zM6 5H5a2 2 0 0 0-2 2v13h18V7a2 2 0 0 0-2-2h-1M8 13h8M8 17h5"/></svg></span><span class="nav-link-title">Đăng ký đề tài</span></a>
        </li>
        <li class="nav-item" th:if="${previewMode}" th:classappend="${activeNav == 'decisions'} ? ' active'">
          <a class="nav-link" th:href="@{/registrations/1/decision}"><span class="nav-symbol" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5h6M9 3h6v4H9zM6 5H5a2 2 0 0 0-2 2v13h18V7a2 2 0 0 0-2-2h-1M8 13l2 2 5-5M8 18h8"/></svg></span><span class="nav-link-title">Xét duyệt đăng ký</span></a>
        </li>
      </ul>
      <div class="sidebar-note">
        <span class="status-dot bg-teal me-2"></span>Cổng đề tài sinh viên
        <p>Một nơi theo dõi hành trình học tập và nghiên cứu.</p>
      </div>
    </div>
  </div>
</aside>
</body>
</html>
